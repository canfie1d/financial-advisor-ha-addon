name: Financial Advisor
version: "1.0.24"
slug: financial_advisor
description: Monarch, Venmo and household settlement MCP servers, plus the Financial Advisor web app
url: https://github.com/canfie1d/financial-advisor-ha-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: Financial Advisor
panel_admin: true
ports:
  8101/tcp: 8106
ports_description:
  8101/tcp: All three servers, routed by hostname, for a reverse proxy on the host
map:
  - data:rw
image: ghcr.io/canfie1d/{arch}-addon-financial-advisor
# Deprecated: settings are now set on each server's page in the panel and stored in /data. These
# options are imported once on the first start of a version with per-server settings, then ignored.
# Kept in the schema (all optional) so the Supervisor does not drop them before the import runs;
# remove them in a later release. The URL defaults stay so installs that never changed them import them.
options:
  monarch_public_url: https://monarch.ryanandkaitlin.com
  venmo_public_url: https://venmo.ryanandkaitlin.com
  fa_public_url: https://financial-advisor.ryanandkaitlin.com
schema:
  oauth_passphrase: password?
  monarch_public_url: str?
  monarch_oauth_signing_secret: password?
  monarch_oauth_passphrase: password?
  monarch_session_id: password?
  monarch_csrf_token: password?
  monarch_token: password?
  monarch_device_uuid: str?
  monarch_email: str?
  monarch_password: password?
  monarch_mfa_secret: password?
  venmo_public_url: str?
  venmo_oauth_signing_secret: password?
  venmo_oauth_passphrase: password?
  venmo_username: str?
  venmo_password: password?
  venmo_device_id: str?
  fa_public_url: str?
  fa_oauth_signing_secret: password?
  fa_oauth_passphrase: password?
  fa_ryan_pin: password?
  fa_access_code: password?
  fa_kait_phone: str?
  anthropic_api_key: password?
  mort_model: str?
